apiVersion: batch/v1
kind: CronJob
metadata:
  name: telemetrygen-log-generator
  namespace: monitoring
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            # 유형 1: Service HTTP 로그 생성기
            - name: telemetrygen-svc-http
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "5"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "Service HTTP request processed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="svc"'
                - '--telemetry-attributes=log_type="http"'
                - '--telemetry-attributes=http_method="GET"'
                - '--telemetry-attributes=http_status_code="200"'
                - '--telemetry-attributes=http_path="/api/v1/resource"'
                - '--telemetry-attributes=service_name="frontend"'

            # 유형 2: Service gRPC 로그 생성기
            - name: telemetrygen-svc-grpc
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "3"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "Service gRPC call completed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="svc"'
                - '--telemetry-attributes=log_type="grpc"'
                - '--telemetry-attributes=grpc_method="GetUser"'
                - '--telemetry-attributes=grpc_status="OK"'
                - '--telemetry-attributes=service_name="user-service"'

            # 유형 3: Service DB 로그 생성기
            - name: telemetrygen-svc-db
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "4"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "Database query executed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="svc"'
                - '--telemetry-attributes=log_type="db"'
                - '--telemetry-attributes=db_operation="SELECT"'
                - '--telemetry-attributes=db_table="users"'
                - '--telemetry-attributes=db_duration_ms="12"'
                - '--telemetry-attributes=service_name="order-service"'

            # 유형 4: Service Cache 로그 생성기
            - name: telemetrygen-svc-cache
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "8"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "Cache operation performed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="svc"'
                - '--telemetry-attributes=log_type="cache"'
                - '--telemetry-attributes=cache_operation="GET"'
                - '--telemetry-attributes=cache_hit="true"'
                - '--telemetry-attributes=service_name="session-service"'

            # 유형 5: Audit Authentication 로그 생성기
            - name: telemetrygen-audit-auth
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "2"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "User authentication attempt"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="audit"'
                - '--telemetry-attributes=log_type="auth"'
                - '--telemetry-attributes=auth_result="success"'
                - '--telemetry-attributes=user_id="user-1042"'
                - '--telemetry-attributes=ip_address="10.0.1.25"'

            # 유형 6: Audit Authorization 로그 생성기
            - name: telemetrygen-audit-authz
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "2"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "User authorization check performed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="audit"'
                - '--telemetry-attributes=log_type="authz"'
                - '--telemetry-attributes=authz_result="allowed"'
                - '--telemetry-attributes=user_id="user-1042"'
                - '--telemetry-attributes=resource="orders"'
                - '--telemetry-attributes=action="read"'

            # 유형 7: Audit Data Access 로그 생성기
            - name: telemetrygen-audit-data
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "1"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "Sensitive data accessed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="audit"'
                - '--telemetry-attributes=log_type="data_access"'
                - '--telemetry-attributes=user_id="admin-007"'
                - '--telemetry-attributes=resource_type="personal_info"'
                - '--telemetry-attributes=record_count="50"'

            # 유형 8: Audit Config Change 로그 생성기
            - name: telemetrygen-audit-config
              image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
              command: ["/telemetrygen"]
              env:
                - name: OTLP_ENDPOINT
                  value: "otel-collector-service:4318"
                - name: RATE
                  value: "1"
                - name: DURATION
                  value: "1000s"
                - name: BODY
                  value: "System configuration changed"
              args:
                - logs
                - --otlp-endpoint=$(OTLP_ENDPOINT)
                - --otlp-http
                - --otlp-insecure
                - --rate=$(RATE)
                - --duration=$(DURATION)
                - --body=$(BODY)
                - '--telemetry-attributes=log_category="audit"'
                - '--telemetry-attributes=log_type="config_change"'
                - '--telemetry-attributes=user_id="admin-007"'
                - '--telemetry-attributes=setting="max_connections"'
                - '--telemetry-attributes=old_value="100"'
                - '--telemetry-attributes=new_value="200"'


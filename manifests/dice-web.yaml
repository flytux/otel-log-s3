apiVersion: v1
kind: ConfigMap
metadata:
  name: dice-web-config
data:
  run.sh: |
    #!/bin/sh
    set -eu
    sed "s|__HYPERDX_API_KEY__|${HYPERDX_API_KEY}|g" /opt/dice-web/index.html.tmpl > /usr/share/nginx/html/index.html
    exec nginx -g 'daemon off;'
  nginx.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
  index.html.tmpl: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>dice-web</title>
      <style>
        :root { color-scheme: light; }
        body { font-family: sans-serif; margin: 2rem; line-height: 1.5; background: #f7f8fb; color: #1c2433; }
        h1, h2, p { margin-top: 0; }
        button { padding: 0.75rem 1rem; font-size: 1rem; border: 0; border-radius: 0.75rem; background: #2563eb; color: #fff; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        code, pre { background: #eef2ff; padding: 0.2rem 0.35rem; border-radius: 0.4rem; }
        .hero { margin-bottom: 1.5rem; padding: 1.5rem; background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1.25rem 0; }
        .card { padding: 1rem; background: #eef2ff; border-radius: 0.9rem; border: 1px solid #c7d2fe; }
        .label { display: block; font-size: 0.8rem; font-weight: 700; color: #4338ca; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .value { display: block; font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
        .session-card { background: #dbeafe; border-color: #93c5fd; }
        .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
        .content { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 1rem; }
        .panel { padding: 1rem; background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
        #events { white-space: pre-wrap; max-height: 420px; overflow: auto; margin: 0; }
        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
      </style>
    </head>
    <body>
      <section class="hero">
        <h1>dice-web session replay sample</h1>
        <p>This page emits browser traces, logs, network events, and session replay data to HyperDX through the OTel collector.</p>
        <div class="hero-grid">
          <div class="card session-card">
            <span class="label">Session ID</span>
            <span class="value" id="session-id">initializing...</span>
          </div>
          <div class="card">
            <span class="label">User Name</span>
            <span class="value" id="user-name">initializing...</span>
          </div>
          <div class="card">
            <span class="label">User Email</span>
            <span class="value" id="user-email">initializing...</span>
          </div>
          <div class="card">
            <span class="label">Last Result</span>
            <span class="value" id="last-roll">waiting...</span>
          </div>
        </div>
        <div class="controls">
          <button id="roll-once" type="button">Roll once now</button>
          <span>SDK source: <code>/assets/hyperdx-browser.js</code></span>
        </div>
      </section>
      <section class="content">
        <div class="panel">
          <h2>User profile</h2>
          <p>Each browser session starts with a random user identity so it is easy to spot in HyperDX sessions and traces.</p>
          <p><strong>User ID:</strong> <code id="user-id">initializing...</code></p>
          <p><strong>Profile source:</strong> sessionStorage</p>
        </div>
        <div class="panel">
          <h2>Local event log</h2>
          <pre id="events"></pre>
        </div>
      </section>
      <script src="/assets/hyperdx-browser.js"></script>
      <script>
        const events = document.getElementById('events');
        const sessionId = document.getElementById('session-id');
        const userId = document.getElementById('user-id');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const lastRoll = document.getElementById('last-roll');
        const PROFILE_STORAGE_KEY = 'dice-web-profile-v1';

        function randomInt(max) {
          if (window.crypto && window.crypto.getRandomValues) {
            const values = new Uint32Array(1);
            window.crypto.getRandomValues(values);
            return values[0] % max;
          }
          return Math.floor(Math.random() * max);
        }

        function buildRandomProfile() {
          const firstNames = ['Juno', 'Mina', 'Theo', 'Aria', 'Noah', 'Sora', 'Lena', 'Owen'];
          const lastNames = ['Kim', 'Park', 'Choi', 'Lee', 'Han', 'Song', 'Lim', 'Jung'];
          const first = firstNames[randomInt(firstNames.length)];
          const last = lastNames[randomInt(lastNames.length)];
          const suffix = String(randomInt(10000)).padStart(4, '0');
          return {
            userId: `dice-user-${suffix}`,
            userName: `${first} ${last}`,
            userEmail: `${first}.${last}.${suffix}@dice.demo`.toLowerCase()
          };
        }

        function getProfile() {
          try {
            const stored = window.sessionStorage.getItem(PROFILE_STORAGE_KEY);
            if (stored) {
              return JSON.parse(stored);
            }
          } catch (error) {
            console.warn('failed to read stored profile', error);
          }

          const created = buildRandomProfile();
          try {
            window.sessionStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(created));
          } catch (error) {
            console.warn('failed to persist profile', error);
          }
          return created;
        }

        const profile = getProfile();
        userId.textContent = profile.userId;
        userName.textContent = profile.userName;
        userEmail.textContent = profile.userEmail;

        function log(message) {
          const line = `[${new Date().toISOString()}] ${message}`;
          console.log(line);
          events.textContent = `${line}\n${events.textContent}`.slice(0, 6000);
        }

        HyperDX.init({
          apiKey: '__HYPERDX_API_KEY__',
          service: 'dice-web',
          url: 'http://otelcol.node-01',
          tracePropagationTargets: [/\/rolldice$/],
          consoleCapture: true,
          advancedNetworkCapture: true,
          maskAllInputs: false,
          disableIntercom: true,
          otelResourceAttributes: {
            'deployment.environment.name': 'demo'
          }
        });

        HyperDX.setGlobalAttributes({
          sample: 'dice-web',
          userId: profile.userId,
          userName: profile.userName,
          userEmail: profile.userEmail
        });

        function forceInitialFullSnapshot() {
          const trigger = function () {
            try {
              HyperDX.resumeSessionRecorder();
              log('forced initial full snapshot');
            } catch (error) {
              console.warn('failed to force initial full snapshot', error);
            }
          };

          if (document.readyState === 'complete') {
            window.setTimeout(trigger, 0);
            return;
          }

          window.addEventListener('load', function onLoad() {
            window.removeEventListener('load', onLoad);
            window.setTimeout(trigger, 0);
          });
        }

        function refreshSessionId() {
          sessionId.textContent = HyperDX.getSessionId() || 'pending';
        }

        async function rollDice(source) {
          try {
            const response = await fetch('/rolldice', { cache: 'no-store' });
            const text = await response.text();
            lastRoll.textContent = text;
            HyperDX.addAction('dice-roll', { source, result: text });
            log(`${source}: ${text}`);
            refreshSessionId();
          } catch (error) {
            HyperDX.recordException(error);
            log(`${source}: request failed - ${error}`);
          }
        }

        document.getElementById('roll-once').addEventListener('click', function () {
          rollDice('button');
        });

        refreshSessionId();
        forceInitialFullSnapshot();
        log(`dice-web initialized for ${profile.userName} <${profile.userEmail}>`);
        rollDice('startup');
        window.setInterval(function () {
          rollDice('interval');
        }, 1000);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dice-web
  labels:
    app: dice-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dice-web
  template:
    metadata:
      labels:
        app: dice-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          env:
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperdx-secret
                  key: HYPERDX_API_KEY
          command:
            - /bin/sh
            - /opt/dice-web/run.sh
          volumeMounts:
            - name: config
              mountPath: /opt/dice-web
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: sdk
              mountPath: /usr/share/nginx/html/assets
      initContainers:
        - name: copy-hyperdx-browser-sdk
          image: docker.hyperdx.io/hyperdx/hyperdx:2
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /assets
              cp /app/packages/app/node_modules/@hyperdx/browser/build/index.js /assets/hyperdx-browser.js
          volumeMounts:
            - name: sdk
              mountPath: /assets
      volumes:
        - name: config
          configMap:
            name: dice-web-config
            defaultMode: 0755
        - name: sdk
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dice-web-service
  labels:
    app: dice-web
spec:
  selector:
    app: dice-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dice-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: dice.node-01
      http:
        paths:
          - path: /rolldice
            pathType: Prefix
            backend:
              service:
                name: dice-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dice-web-service
                port:
                  number: 80

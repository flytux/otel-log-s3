receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://dice.node-01
            - http://hyperdx.node-01
          allowed_headers:
            - "*"
          max_age: 7200
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector-internal'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']
  filelog/k8s:
    include:
      - /var/log/pods/*/*/*.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
processors:
  batch: {}
  transform/fix_time:
    log_statements:
      - context: log
        statements:
          - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
          - set(time_unix_nano, Now()) where time_unix_nano == 0
          - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
  filter/session_only:
    error_mode: ignore
    logs:
      log_record:
        - attributes["sessionId"] == nil
  filter/no_session:
    error_mode: ignore
    logs:
      log_record:
        - attributes["sessionId"] != nil
  k8sattributes:
    auth_type: "serviceAccount"
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.container.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
  transform/k8s:
    log_statements:
      - context: log
        statements:
          - set(attributes["log_type"], "k8s")
  resource/k8s:
    attributes:
      - key: log_type
        value: "k8s"
        action: insert
  transform/otel:
    log_statements:
      - context: log
        statements:
          - set(attributes["log_type"], "otel")
  resource/otel:
    attributes:
      - key: log_type
        value: "otel"
        action: insert
exporters:
  clickhouse/otel:
    endpoint: tcp://clickhouse-clickhouse-headless:9000
    database: default
    username: default
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s     # 10분간 재시도
    sending_queue:
      enabled: true
      num_consumers: 4           # 동시 연결 줄여 too_many_parts 방지
      queue_size: 5000           # 큐 크기 증가로 burst 흡수
  clickhouse/sessions:
    endpoint: tcp://clickhouse-clickhouse-headless:9000
    database: default
    username: default
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: hyperdx_sessions
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
  awss3:
    marshaler: "otlp_json"                
    s3uploader:                           
      s3_bucket: "clickhouse-cold"    
      region: "us-east-1"                 
      endpoint: "http://minio-service:9000"       
      s3_force_path_style: true           
      disable_ssl: true                   
    resource_attrs_to_s3:
      s3_prefix: "log_type" 
service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed            # OTel Collector 내부 메트릭 상세 수집
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines:
    logs/otel:
      receivers: [otlp]
      processors: [transform/fix_time, filter/no_session, transform/otel, resource/otel, batch]
      exporters: [clickhouse/otel, awss3]
    logs/k8s:
      receivers: [filelog/k8s]
      processors: [k8sattributes, transform/k8s, resource/k8s] # 메타데이터 주입 후 log_type 세팅
      exporters: [awss3]    # 이전 답변의 공통 목적지 배치
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse/otel]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [clickhouse/otel]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://dice.node-01
            - http://hyperdx.node-01
          allowed_headers:
            - "*"
          max_age: 7200
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector-internal'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']
processors:
processors:
  # 배치 크기/시간 최적화: ClickHouse INSERT 횟수 줄여 too_many_parts 방지
  batch:
    send_batch_size: 10000       # 한 번에 10k 행 묶어서 전송
    send_batch_max_size: 20000
    timeout: 5s                  # 최대 5초 대기 후 강제 flush
  transform/fix_time:
    log_statements:
      - context: log
        statements:
          - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
          - set(time_unix_nano, Now()) where time_unix_nano == 0
          - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
  # Session Replay 로그만 통과 (HyperDX 브라우저 SDK가 sessionId 속성으로 전송)
  filter/session_only:
    error_mode: ignore
    logs:
      log_record:
        - attributes["sessionId"] == nil
  # 일반 로그만 통과 (sessionId 없는 것)
  filter/no_session:
    error_mode: ignore
    logs:
      log_record:
        - attributes["sessionId"] != nil
exporters:
  clickhouse/otel:
    endpoint: tcp://clickhouse-clickhouse-headless:9000
    database: default
    username: default
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s     # 10분간 재시도
    sending_queue:
      enabled: true
      num_consumers: 4           # 동시 연결 줄여 too_many_parts 방지
      queue_size: 5000           # 큐 크기 증가로 burst 흡수
  clickhouse/sessions:
    endpoint: tcp://clickhouse-clickhouse-headless:9000
    database: default
    username: default
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: hyperdx_sessions
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed            # OTel Collector 내부 메트릭 상세 수집
      address: 0.0.0.0:8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/fix_time, filter/no_session, batch]
      exporters: [clickhouse/otel]
    logs/sessions:
      receivers: [otlp]
      processors: [transform/fix_time, filter/session_only, batch]
      exporters: [clickhouse/sessions]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse/otel]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [clickhouse/otel]

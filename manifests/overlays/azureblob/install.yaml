        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_PLUGINS_PREINSTALL
          value: grafana-clickhouse-datasource
        image: grafana/grafana:latest
        name: grafana
        ports:
        - containerPort: 3000
          name: grafana-port
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage
        - mountPath: /etc/grafana/provisioning/datasources/clickhouse.yaml
          name: grafana-datasources
          subPath: clickhouse.yaml
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - configMap:
          name: grafana-datasources
        name: grafana-datasources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hyperdx
  name: hyperdx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx
  template:
    metadata:
      labels:
        app: hyperdx
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: hyperdx-config
        - secretRef:
            name: hyperdx-secret
        image: docker.hyperdx.io/hyperdx/hyperdx:2
        livenessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 60
          periodSeconds: 20
        name: hyperdx
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 8000
          name: api
        - containerPort: 4320
          name: opamp
        readinessProbe:
          httpGet:
            path: /api/health
            port: web
          initialDelaySeconds: 20
          periodSeconds: 10
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          until nc -z hyperdx-mongodb 27017; do
            sleep 2
          done
          until wget -qO- http://clickhouse-clickhouse-headless:8123/ping | grep -q '^Ok\.$'; do
            sleep 2
          done
        image: busybox:1.36
        name: wait-for-dependencies
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hyperdx-mongodb
  name: hyperdx-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx-mongodb
  template:
    metadata:
      labels:
        app: hyperdx-mongodb
    spec:
      containers:
      - image: mongo:5.0.32-focal
        livenessProbe:
          initialDelaySeconds: 20
          periodSeconds: 10
          tcpSocket:
            port: mongodb
        name: mongodb
        ports:
        - containerPort: 27017
          name: mongodb
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: mongodb
        volumeMounts:
        - mountPath: /data/db
          name: mongodb-data
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: hyperdx-mongodb-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        azure.workload.identity/use: "true"
    spec:
      containers:
      - args:
        - --config=/etc/otelcol/config.yaml
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: clickhouse-password
        image: flytux/otelcol-contrib:v0.152
        name: otel-collector
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 55679
        - containerPort: 8888
        volumeMounts:
        - mountPath: /etc/otelcol/config.yaml
          name: config-volume
          subPath: config.yaml
      serviceAccountName: otel-collector
      volumes:
      - configMap:
          name: otel-collector-config
        name: config-volume
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - /scripts/run.sh
        image: clickhouse/clickhouse-server:25.12
        name: clickhouse-init
        volumeMounts:
        - mountPath: /scripts/run.sh
          name: init-runtime-config
          subPath: run.sh
        - mountPath: /scripts/cluster.sql
          name: init-sql-config
          subPath: cluster.sql
      restartPolicy: OnFailure
      volumes:
      - configMap:
          defaultMode: 493
          name: clickhouse-init-runtime-config
        name: init-runtime-config
      - configMap:
          name: clickhouse-init-sql-config
        name: init-sql-config
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
spec:
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.12"
    volumeMounts:
    - mountPath: /etc/clickhouse-server/config.d/
      name: storage-config
  dataVolumeClaimSpec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: local-path
  keeperClusterRef:
    name: clickhouse-keeper
  labels:
    azure.workload.identity/use: "true"
  podTemplate:
    serviceAccountName: clickhouse
    volumes:
    - configMap:
        name: clickhouse-storage-config
      name: storage-config
  replicas: 1
  settings:
    defaultUserPassword:
      passwordType: password
      secret:
        key: password
        name: clickhouse-password
  shards: 3
---
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: clickhouse-keeper
spec:
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.12"
  dataVolumeClaimSpec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
    storageClassName: local-path
  replicas: 1
---

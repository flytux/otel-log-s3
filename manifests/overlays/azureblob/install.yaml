kind: ConfigMap
metadata:
  name: clickhouse-init-sql-config
---
apiVersion: v1
data:
  storage.xml: |
    <clickhouse>
      <storage_configuration>
        <disks>
          <azure_cold>
            <type>azure_blob_storage</type>
            <storage_account_url>https://__AZURE_STORAGE_ACCOUNT_NAME__.blob.core.windows.net/clickhouse-cold/</storage_account_url>
            <container_name>clickhouse-cold</container_name>
          </azure_cold>
        </disks>
        <policies>
          <tiered>
            <volumes>
              <hot>
                <disk>default</disk>
                <max_data_part_size_bytes>1073741824</max_data_part_size_bytes>
              </hot>
              <cold>
                <disk>azure_cold</disk>
              </cold>
            </volumes>
            <!-- hot 볼륨 여유공간이 30% 미만이면 cold로 이동 -->
            <move_factor>0.3</move_factor>
          </tiered>
        </policies>
      </storage_configuration>
    </clickhouse>
kind: ConfigMap
metadata:
  name: clickhouse-storage-config
---
apiVersion: v1
data:
  index.html.tmpl: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>dice-web</title>\n
    \ <style>\n    :root { color-scheme: light; }\n    body { font-family: sans-serif;
    margin: 2rem; line-height: 1.5; background: #f7f8fb; color: #1c2433; }\n    h1,
    h2, p { margin-top: 0; }\n    button { padding: 0.75rem 1rem; font-size: 1rem;
    border: 0; border-radius: 0.75rem; background: #2563eb; color: #fff; cursor: pointer;
    }\n    button:hover { background: #1d4ed8; }\n    code, pre { background: #eef2ff;
    padding: 0.2rem 0.35rem; border-radius: 0.4rem; }\n    .hero { margin-bottom:
    1.5rem; padding: 1.5rem; background: #fff; border-radius: 1rem; box-shadow: 0
    8px 24px rgba(15, 23, 42, 0.08); }\n    .hero-grid { display: grid; grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1.25rem 0; }\n    .card
    { padding: 1rem; background: #eef2ff; border-radius: 0.9rem; border: 1px solid
    #c7d2fe; }\n    .label { display: block; font-size: 0.8rem; font-weight: 700;
    color: #4338ca; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom:
    0.35rem; }\n    .value { display: block; font-size: 1.05rem; font-weight: 600;
    overflow-wrap: anywhere; }\n    .session-card { background: #dbeafe; border-color:
    #93c5fd; }\n    .controls { display: flex; gap: 0.75rem; align-items: center;
    flex-wrap: wrap; margin-top: 1rem; }\n    .content { display: grid; grid-template-columns:
    minmax(280px, 360px) minmax(0, 1fr); gap: 1rem; }\n    .panel { padding: 1rem;
    background: #fff; border-radius: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42,
    0.06); }\n    #events { white-space: pre-wrap; max-height: 420px; overflow: auto;
    margin: 0; }\n    @media (max-width: 900px) { .content { grid-template-columns:
    1fr; } }\n  </style>\n</head>\n<body>\n  <section class=\"hero\">\n    <h1>dice-web
    session replay sample</h1>\n    <p>This page emits browser traces, logs, network
    events, and session replay data to HyperDX through the OTel collector.</p>\n    <div
    class=\"hero-grid\">\n      <div class=\"card session-card\">\n        <span class=\"label\">Session
    ID</span>\n        <span class=\"value\" id=\"session-id\">initializing...</span>\n
    \     </div>\n      <div class=\"card\">\n        <span class=\"label\">User Name</span>\n
    \       <span class=\"value\" id=\"user-name\">initializing...</span>\n      </div>\n
    \     <div class=\"card\">\n        <span class=\"label\">User Email</span>\n
    \       <span class=\"value\" id=\"user-email\">initializing...</span>\n      </div>\n
    \     <div class=\"card\">\n        <span class=\"label\">Last Result</span>\n
    \       <span class=\"value\" id=\"last-roll\">waiting...</span>\n      </div>\n
    \   </div>\n    <div class=\"controls\">\n      <button id=\"roll-once\" type=\"button\">Roll
    once now</button>\n      <span>SDK source: <code>/assets/hyperdx-browser.js</code></span>\n
    \   </div>\n  </section>\n  <section class=\"content\">\n    <div class=\"panel\">\n
    \     <h2>User profile</h2>\n      <p>Each browser session starts with a random
    user identity so it is easy to spot in HyperDX sessions and traces.</p>\n      <p><strong>User
    ID:</strong> <code id=\"user-id\">initializing...</code></p>\n      <p><strong>Profile
    source:</strong> sessionStorage</p>\n    </div>\n    <div class=\"panel\">\n      <h2>Local
    event log</h2>\n      <pre id=\"events\"></pre>\n    </div>\n  </section>\n  <script
    src=\"/assets/hyperdx-browser.js\"></script>\n  <script>\n    const events = document.getElementById('events');\n
    \   const sessionId = document.getElementById('session-id');\n    const userId
    = document.getElementById('user-id');\n    const userName = document.getElementById('user-name');\n
    \   const userEmail = document.getElementById('user-email');\n    const lastRoll
    = document.getElementById('last-roll');\n    const PROFILE_STORAGE_KEY = 'dice-web-profile-v1';\n\n
    \   function randomInt(max) {\n      if (window.crypto && window.crypto.getRandomValues)
    {\n        const values = new Uint32Array(1);\n        window.crypto.getRandomValues(values);\n
    \       return values[0] % max;\n      }\n      return Math.floor(Math.random()
    * max);\n    }\n\n    function buildRandomProfile() {\n      const firstNames
    = ['Juno', 'Mina', 'Theo', 'Aria', 'Noah', 'Sora', 'Lena', 'Owen'];\n      const
    lastNames = ['Kim', 'Park', 'Choi', 'Lee', 'Han', 'Song', 'Lim', 'Jung'];\n      const
    first = firstNames[randomInt(firstNames.length)];\n      const last = lastNames[randomInt(lastNames.length)];\n
    \     const suffix = String(randomInt(10000)).padStart(4, '0');\n      return
    {\n        userId: `dice-user-${suffix}`,\n        userName: `${first} ${last}`,\n
    \       userEmail: `${first}.${last}.${suffix}@dice.demo`.toLowerCase()\n      };\n
    \   }\n\n    function getProfile() {\n      try {\n        const stored = window.sessionStorage.getItem(PROFILE_STORAGE_KEY);\n
    \       if (stored) {\n          return JSON.parse(stored);\n        }\n      }
    catch (error) {\n        console.warn('failed to read stored profile', error);\n
    \     }\n\n      const created = buildRandomProfile();\n      try {\n        window.sessionStorage.setItem(PROFILE_STORAGE_KEY,
    JSON.stringify(created));\n      } catch (error) {\n        console.warn('failed
    to persist profile', error);\n      }\n      return created;\n    }\n\n    const
    profile = getProfile();\n    userId.textContent = profile.userId;\n    userName.textContent
    = profile.userName;\n    userEmail.textContent = profile.userEmail;\n\n    function
    log(message) {\n      const line = `[${new Date().toISOString()}] ${message}`;\n
    \     console.log(line);\n      events.textContent = `${line}\\n${events.textContent}`.slice(0,
    6000);\n    }\n\n    HyperDX.init({\n      apiKey: '__HYPERDX_API_KEY__',\n      service:
    'dice-web',\n      url: 'http://otelcol.node-01',\n      tracePropagationTargets:
    [/\\/rolldice$/],\n      consoleCapture: true,\n      advancedNetworkCapture:
    true,\n      maskAllInputs: false,\n      disableIntercom: true,\n      otelResourceAttributes:
    {\n        'deployment.environment.name': 'demo'\n      }\n    });\n\n    HyperDX.setGlobalAttributes({\n
    \     sample: 'dice-web',\n      userId: profile.userId,\n      userName: profile.userName,\n
    \     userEmail: profile.userEmail, \n      guid: 'testestset-testsets-testestset',\n
    \     screenId: 'aaaaaa-bbbbbbb-bbbbbbb-cccccr'\n    });\n\n    function forceInitialFullSnapshot()
    {\n      const trigger = function () {\n        try {\n          HyperDX.resumeSessionRecorder();\n
    \         log('forced initial full snapshot');\n        } catch (error) {\n          console.warn('failed
    to force initial full snapshot', error);\n        }\n      };\n\n      if (document.readyState
    === 'complete') {\n        window.setTimeout(trigger, 0);\n        return;\n      }\n\n
    \     window.addEventListener('load', function onLoad() {\n        window.removeEventListener('load',
    onLoad);\n        window.setTimeout(trigger, 0);\n      });\n    }\n\n    function
    refreshSessionId() {\n      sessionId.textContent = HyperDX.getSessionId() ||
    'pending';\n    }\n\n    async function rollDice(source) {\n      try {\n        const
    response = await fetch('/rolldice', { cache: 'no-store' });\n        const text
    = await response.text();\n        lastRoll.textContent = text;\n        HyperDX.addAction('dice-roll',
    { source, result: text });\n        log(`${source}: ${text}`);\n        refreshSessionId();\n
    \     } catch (error) {\n        HyperDX.recordException(error);\n        log(`${source}:
    request failed - ${error}`);\n      }\n    }\n\n    document.getElementById('roll-once').addEventListener('click',
    function () {\n      rollDice('button');\n    });\n\n    refreshSessionId();\n
    \   forceInitialFullSnapshot();\n    log(`dice-web initialized for ${profile.userName}
    <${profile.userEmail}>`);\n    rollDice('startup');\n    window.setInterval(function
    () {\n      rollDice('interval');\n    }, 1000);\n  </script>\n</body>\n</html>\n"
  nginx.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
  run.sh: |
    #!/bin/sh
    set -eu
    sed "s|__HYPERDX_API_KEY__|${HYPERDX_API_KEY}|g" /opt/dice-web/index.html.tmpl > /usr/share/nginx/html/index.html
    exec nginx -g 'daemon off;'

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - azure-workload-identity-config.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: clickhouse-init-sql-config
    files:
      - cluster.sql
      - ingest.sql
  - name: otel-collector-config
    files:
      - config.yaml=otelcol-config.yaml

patches:
  - path: clickhouse-azure-workload-identity.yaml
  - path: clickhouse-init-azure-env.yaml
  - path: otel-collector-azure-workload-identity.yaml

replacements:
  - source:
      kind: ConfigMap
      name: azure-workload-identity-config
      fieldPath: data.AZURE_CLIENT_ID
    targets:
      - select:
          kind: ServiceAccount
          name: azure-workload-identity
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: azure-workload-identity-config
      fieldPath: data.AZURE_TENANT_ID
    targets:
      - select:
          kind: ServiceAccount
          name: azure-workload-identity
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  clickhouse.yaml: |
    apiVersion: 1
    prune: true
    deleteDatasources:
      - name: ClickHouse
        orgId: 1
    datasources:
      - name: ClickHouse
        uid: clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        orgId: 1
        editable: true
        isDefault: true
        url: http://clickhouse-clickhouse-0-0-0.clickhouse-clickhouse-headless:8123
        jsonData:
          host: clickhouse-service
          port: 8123
          protocol: http
          username: default
          defaultDatabase: default
          validateSql: true
          logs:
            defaultDatabase: default
            defaultTable: otel_logs
            timeColumn: Timestamp
            filterTimeColumn: TimestampTime
            levelColumn: SeverityText
            messageColumn: Body
            selectContextColumns: true
            contextColumns:
              - TraceId
              - SpanId
              - ServiceName
              - LogAttributes
              - ResourceAttributes
            showLogLinks: true
          traces:
            defaultDatabase: default
            defaultTable: otel_traces
            traceIdColumn: TraceId
            spanIdColumn: SpanId
            parentSpanIdColumn: ParentSpanId
            operationNameColumn: SpanName
            serviceNameColumn: ServiceName
            durationColumn: Duration
            durationUnit: nanoseconds
            startTimeColumn: Timestamp
            tagsColumn: SpanAttributes
            serviceTagsColumn: ResourceAttributes
            kindColumn: SpanKind
            statusCodeColumn: StatusCode
            statusMessageColumn: StatusMessage
            traceTimestampTableSuffix: _trace_id_ts
        secureJsonData:
          password: clickhouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: grafana-port
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin" # 초기 관리자 비밀번호
            - name: GF_PLUGINS_PREINSTALL
              value: "grafana-clickhouse-datasource"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/clickhouse.yaml
              subPath: clickhouse.yaml
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: grafana-ingress
spec:
  ingressClassName: traefik
  rules:  
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: grafana.node-01
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000

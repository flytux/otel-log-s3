apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-password
type: Opaque
stringData:
  password: clickhouse
---
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: clickhouse-keeper
spec:
  replicas: 1
  dataVolumeClaimSpec:
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.12"
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
spec:
  shards: 3
  replicas: 1
  keeperClusterRef:
    name: clickhouse-keeper
  dataVolumeClaimSpec:
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  containerTemplate:
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.12"
  settings:
    defaultUserPassword:
      passwordType: password
      secret:
        name: clickhouse-password
        key: password
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: clickhouse-init
          image: clickhouse/clickhouse-server:25.12
          command:
            - /bin/sh
            - /scripts/run.sh
          volumeMounts:
            - name: init-runtime-config
              mountPath: /scripts/run.sh
              subPath: run.sh
            - name: init-sql-config
              mountPath: /scripts/cluster.sql
              subPath: cluster.sql
            - name: init-sql-config
              mountPath: /scripts/ingest.sql
              subPath: ingest.sql
      volumes:
        - name: init-runtime-config
          configMap:
            name: clickhouse-init-runtime-config
            defaultMode: 0755
        - name: init-sql-config
          configMap:
            name: clickhouse-init-sql-config

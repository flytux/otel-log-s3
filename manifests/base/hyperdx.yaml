apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hyperdx-mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: hyperdx-secret
type: Opaque
stringData:
  HYPERDX_API_KEY: 0d93bdf4-cccd-4fd0-b338-7259a11775a2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperdx-config
data:
  HYPERDX_APP_URL: http://hyperdx.node-01
  FRONTEND_URL: http://hyperdx.node-01
  HYPERDX_APP_PORT: "8080"
  HYPERDX_API_PORT: "8000"
  HYPERDX_OPAMP_PORT: "4320"
  HYPERDX_LOG_LEVEL: info
  EXPRESS_SESSION_SECRET: hyperdx is cool
  MONGO_URI: mongodb://hyperdx-mongodb:27017/hyperdx
  SERVER_URL: http://127.0.0.1:8000
  USAGE_STATS_ENABLED: "false"
  DEFAULT_CONNECTIONS: >-
    [{"name":"Local ClickHouse","host":"http://clickhouse-service:8123","username":"default","password":"clickhouse"}]
  DEFAULT_SOURCES: >-
    [{"from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local ClickHouse","traceSourceId":"Traces","sessionSourceId":"Sessions","metricSourceId":"Metrics"},{"from":{"databaseName":"default","tableName":"otel_traces"},"kind":"trace","timestampValueExpression":"Timestamp","name":"Traces","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"SpanName","serviceNameExpression":"ServiceName","eventAttributesExpression":"SpanAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","durationExpression":"Duration","durationPrecision":9,"parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName","spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode","statusMessageExpression":"StatusMessage","connection":"Local ClickHouse","logSourceId":"Logs","sessionSourceId":"Sessions","metricSourceId":"Metrics"},{"from":{"databaseName":"default","tableName":""},"kind":"metric","timestampValueExpression":"TimeUnix","name":"Metrics","serviceNameExpression":"ServiceName","resourceAttributesExpression":"ResourceAttributes","metricTables":{"gauge":"otel_metrics_gauge","histogram":"otel_metrics_histogram","sum":"otel_metrics_sum","summary":"otel_metrics_summary","exponential histogram":"otel_metrics_exp_histogram"},"connection":"Local ClickHouse","logSourceId":"Logs","traceSourceId":"Traces","sessionSourceId":"Sessions"},{"from":{"databaseName":"default","tableName":"hyperdx_sessions"},"kind":"session","timestampValueExpression":"TimestampTime","name":"Sessions","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local ClickHouse","logSourceId":"Logs","traceSourceId":"Traces","metricSourceId":"Metrics"}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperdx-mongodb
  labels:
    app: hyperdx-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx-mongodb
  template:
    metadata:
      labels:
        app: hyperdx-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:5.0.32-focal
          ports:
            - containerPort: 27017
              name: mongodb
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: hyperdx-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hyperdx-mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: hyperdx-mongodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperdx
  labels:
    app: hyperdx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx
  template:
    metadata:
      labels:
        app: hyperdx
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until nc -z hyperdx-mongodb 27017; do
                sleep 2
              done
              until wget -qO- http://clickhouse-service:8123/ping | grep -q '^Ok\.$'; do
                sleep 2
              done
      containers:
        - name: hyperdx
          image: docker.hyperdx.io/hyperdx/hyperdx:2
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 8000
              name: api
            - containerPort: 4320
              name: opamp
          envFrom:
            - configMapRef:
                name: hyperdx-config
            - secretRef:
                name: hyperdx-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hyperdx-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: web
  selector:
    app: hyperdx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyperdx-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: hyperdx.node-01
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hyperdx-service
                port:
                  number: 8080

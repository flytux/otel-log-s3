apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clickhouse.yaml
  - otelcol.yaml
  - dice-service.yaml
  - grafana.yaml
  - hyperdx.yaml
  - dice-web.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: clickhouse-init-runtime-config
    files:
      - run.sh

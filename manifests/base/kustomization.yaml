apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clickhouse-resources.yaml
  - clickhouse-version.yaml
  - otelcol-base.yaml
  - dice-service.yaml
  - grafana.yaml
  - hyperdx.yaml
  - dice-web.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: clickhouse-init-runtime-config
    files:
      - run.sh

replacements:
  - source:
      kind: ConfigMap
      name: clickhouse-version
      fieldPath: data.tag
    targets:
      - select:
          kind: KeeperCluster
          name: clickhouse-keeper
        fieldPaths:
          - spec.containerTemplate.image.tag
      - select:
          kind: ClickHouseCluster
          name: clickhouse
        fieldPaths:
          - spec.containerTemplate.image.tag
  - source:
      kind: ConfigMap
      name: clickhouse-version
      fieldPath: data.serverImage
    targets:
      - select:
          kind: Job
          name: clickhouse-init
        fieldPaths:
          - spec.template.spec.containers.0.image

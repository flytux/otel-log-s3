apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: clickhouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8s-metadata
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8s-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-k8s-metadata
subjects:
- kind: ServiceAccount
  name: otel-collector # Collector DaemonSet이 사용하는 ServiceAccount 이름
  namespace: clickhouse
---
apiVersion: apps/v1
kind: DaemonSet 
metadata:
  name: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector 
      containers:
      - name: otel-collector
        image: flytux/otelcol-contrib:v0.152
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args: ["--config=/etc/otelcol/config.yaml"]
        ports:
          - containerPort: 4317
          - containerPort: 4318
          - containerPort: 55679
          - containerPort: 8888
        volumeMounts:
          - name: config-volume
            mountPath: /etc/otelcol/config.yaml
            subPath: config.yaml
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true
      volumes:
        - name: config-volume
          configMap:  
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: zpages
      port: 55679
      targetPort: 55679
    - name: metrics
      port: 8888
      targetPort: 8888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-collector-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: otelcol.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-collector-service
                port:
                  number: 4318

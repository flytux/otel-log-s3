apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |-
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - http://dice.node-01
                - http://hyperdx.node-01
              allowed_headers:
                - "*"
              max_age: 7200
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector-internal'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
    processors:
      batch:
      transform/fix_time:
        log_statements:
          - context: log
            statements:
              # observed_time_unix_nano 가 0(미설정)이면 time_unix_nano 로 채움
              - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
              # time_unix_nano 도 0이면 수집 시각(Now)으로 채움
              - set(time_unix_nano, Now()) where time_unix_nano == 0
              - set(observed_time_unix_nano, time_unix_nano) where observed_time_unix_nano == 0
      filter/session_logs:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["service.name"] == nil
            - resource.attributes["service.name"] != "dice-web"
    exporters:
      awss3/logs:
        s3uploader:
          region: us-east-1
          s3_bucket: otel-logs
          s3_prefix: logs
          endpoint: http://minio-service:9000
          s3_force_path_style: true
      awss3/traces:
        s3uploader:
          region: us-east-1
          s3_bucket: otel-traces
          s3_prefix: traces
          endpoint: http://minio-service:9000
          s3_force_path_style: true
      awss3/metrics:
        s3uploader:
          region: us-east-1
          s3_bucket: otel-metrics
          s3_prefix: metrics
          endpoint: http://minio-service:9000
          s3_force_path_style: true
      awss3/sessions:
        s3uploader:
          region: us-east-1
          s3_bucket: hyperdx-sessions
          s3_prefix: sessions
          endpoint: http://minio-service:9000
          s3_force_path_style: true
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [otlp]
          processors: [transform/fix_time, batch]
          exporters: [awss3/logs]
        logs/sessions:
          receivers: [otlp]
          processors: [transform/fix_time, filter/session_logs, batch]
          exporters: [awss3/sessions]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [awss3/traces]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch]
          exporters: [awss3/metrics]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: flytux/otelcol-contrib:v0.152
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: AWS_ACCESS_KEY_ID
          value: "minioadmin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minioadmin"
        args: ["--config=/etc/otelcol/config.yaml"]
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 55679
        - containerPort: 8888
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otelcol/config.yaml
          subPath: config.yaml
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: zpages
      port: 55679
      targetPort: 55679
    - name: metrics
      port: 8888
      targetPort: 8888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-collector-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: otelcol.node-01
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: otel-collector-service
            port:
              number: 4318
